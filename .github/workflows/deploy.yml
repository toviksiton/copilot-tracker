name: Deploy to master

on:
  push:
    branches:
      - 'claude/sync-json-github-cache-WnynD'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: claude/sync-json-github-cache-WnynD

      - name: Deploy index.html via GitHub Contents API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import base64, json, os, urllib.request, urllib.error

          token = os.environ['GH_TOKEN']
          repo  = os.environ['REPO']
          api   = f'https://api.github.com/repos/{repo}/contents/index.html'
          hdrs  = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
          }

          with open('design-merged.html', 'rb') as f:
              content = base64.b64encode(f.read()).decode()

          # Get current SHA of index.html on master
          try:
              req = urllib.request.Request(f'{api}?ref=master', headers=hdrs)
              with urllib.request.urlopen(req) as r:
                  sha = json.loads(r.read()).get('sha', '')
          except urllib.error.HTTPError:
              sha = ''

          payload = {
              'message': 'Deploy: Copilot Tracker light/dark dashboard as main URL',
              'content': content,
              'branch':  'master',
          }
          if sha:
              payload['sha'] = sha

          req = urllib.request.Request(
              api,
              data=json.dumps(payload).encode(),
              headers=hdrs,
              method='PUT',
          )
          with urllib.request.urlopen(req) as r:
              result = json.loads(r.read())
              print('Deployed:', result['content']['html_url'])
          EOF
