name: Deploy to master

on:
  push:
    branches:
      - 'claude/sync-json-github-cache-WnynD'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: claude/sync-json-github-cache-WnynD
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge design-merged.html into master
        run: |
          git checkout master
          git checkout claude/sync-json-github-cache-WnynD -- design-merged.html
          git add design-merged.html
          git diff --cached --quiet || git commit -m "Deploy: light/dark mode Copilot Tracker dashboard"
          git push origin master
