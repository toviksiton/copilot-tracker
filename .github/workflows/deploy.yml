name: Deploy to master

on:
  push:
    branches:
      - 'claude/sync-json-github-cache-WnynD'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Deploy design-merged.html to master
        run: |
          git checkout master
          git checkout claude/sync-json-github-cache-WnynD -- design-merged.html
          git add design-merged.html
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "Deploy: light/dark mode Copilot Tracker dashboard"
          git push origin master
