name: Deploy to master

on:
  push:
    branches:
      - 'claude/sync-json-github-cache-WnynD'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: claude/sync-json-github-cache-WnynD

      - name: Deploy index.html via GitHub Contents API
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Encode file
          CONTENT=$(base64 -w 0 design-merged.html)

          # Get current SHA of index.html on master
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/contents/index.html?ref=master")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "GET index.html status: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            SHA=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['sha'])")
            echo "Existing SHA: $SHA"
            PAYLOAD=$(python3 -c "
          import json, sys
          print(json.dumps({
            'message': 'Deploy: Copilot Tracker light/dark dashboard',
            'content': sys.argv[1],
            'branch':  'master',
            'sha':     sys.argv[2],
          }))" "$CONTENT" "$SHA")
          else
            echo "File not found, creating new."
            PAYLOAD=$(python3 -c "
          import json, sys
          print(json.dumps({
            'message': 'Deploy: Copilot Tracker light/dark dashboard',
            'content': sys.argv[1],
            'branch':  'master',
          }))" "$CONTENT")
          fi

          # PUT the file
          RESULT=$(curl -s -w "\n%{http_code}" -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/contents/index.html" \
            -d "$PAYLOAD")
          PUT_CODE=$(echo "$RESULT" | tail -1)
          PUT_BODY=$(echo "$RESULT" | head -n -1)
          echo "PUT status: $PUT_CODE"
          echo "$PUT_BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Deployed:', d.get('content',{}).get('html_url','(see above)'))" 2>/dev/null || echo "$PUT_BODY"

          [ "$PUT_CODE" = "200" ] || [ "$PUT_CODE" = "201" ] || exit 1
